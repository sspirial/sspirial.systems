<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>sspirial.systems - R&D Micro-Studio</title>
    
    <!-- Performance optimizations -->
    <meta name="theme-color" content="#000000" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    
    
    <!-- Open Graph & Social Meta Tags -->
    <meta property="og:title" content="sspirial.systems - R&D Micro-Studio" />
    <meta property="og:description" content="A sovereign microlab exploring systems thinking, technical oddities, and architectural innovation." />
    <meta property="og:image" content="/sspirial_logo.png" />
    <meta property="og:type" content="website" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/sspirial_logo.png" />
    <link rel="apple-touch-icon" href="/sspirial_logo.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/index.tsx" />
    
    <!-- Critical CSS for above-the-fold content -->
    <style>
        /* Critical CSS - prevents FOUC */
        body{margin:0;font-family:"Plus Jakarta Sans",sans-serif;background:#050505;color:#fff;transition:background-color .3s}
        .dark body{background:#050505}
        #root{min-height:100vh;display:flex;flex-direction:column}
        /* Loading state */
        .loading-spinner{display:flex;align-items:center;justify-content:center;min-height:50vh}
        .spinner{width:2rem;height:2rem;border:4px solid #FCA311;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>

</head>

<body class="bg-background-light dark:bg-background-dark text-[#111318] dark:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
